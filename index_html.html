    <div class="toolbar"><button class="btn ghost" data-reqcancel>Withdraw request</button><button class="btn ghost" data-tcsignout>Sign out</button></div></div></section>`;
  return `<section style="max-width:460px;margin:40px auto 0"><form class="panel" id="req-form" style="display:flex;flex-direction:column;gap:12px">${head}
    <div class="field"><label for="rq-name">Your name</label><input id="rq-name" required value="${esc(u.displayName||"")}" autocomplete="name"></div>
    <div class="field"><label for="rq-note">Note to the owner (optional)</label><input id="rq-note" maxlength="200" placeholder="e.g. Head of Department, for succession review"></div>
    <div class="toolbar"><button class="btn primary" type="submit">Request access</button><button class="btn ghost" type="button" data-tcsignout>Sign out</button></div></form></section>`;
}
function fmtWhen(t){try{return new Date(t).toLocaleString("en-MY",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"})}catch(e){return ""}}
function requestsBanner(){
  const rs=Object.entries(S.reqs||{}).filter(([,r])=>r.status==="pending").sort((a,b)=>(a[1].at||"").localeCompare(b[1].at||""));
  if(!rs.length)return "";
  return `<div class="panel" style="margin-bottom:14px;border-left:4px solid var(--r1)"><div class="eyebrow" style="margin-bottom:8px">Access requests (${rs.length})</div><ul class="ppl">${rs.map(([id,r])=>`<li style="flex-wrap:wrap;gap:8px"><span><strong>${esc(r.name||id)}</strong> <span class="mono faint" style="font-size:12px">${esc(id)}</span>${r.note?`<div class="faint" style="font-size:12.5px">${esc(r.note)}</div>`:""}<div class="faint" style="font-size:11.5px">${esc(fmtWhen(r.at))}</div></span>
    <span class="toolbar" style="gap:6px"><button class="btn primary" data-reqok="${esc(id)}" data-role="viewer">Approve — view all</button><button class="btn" data-reqok="${esc(id)}" data-role="editor">Approve — full edit</button><button class="btn" data-reqok="${esc(id)}" data-role="admin">Approve — admin</button><button class="btn ghost danger" data-reqno="${esc(id)}">Reject</button></span></li>`).join("")}</ul>
    <div class="faint" style="font-size:12px;margin-top:6px">View all: whole portal, read-only. Full edit: whole portal, can edit. Admin: talent cards and staff directory, can edit.</div></div>`;
}
async function sendRequest(){
  const name=($("#rq-name")?.value||"").trim();const note=($("#rq-note")?.value||"").trim();if(!name){toast("Enter your name.");return}
  const btn=$("#req-form button[type=submit]");if(btn)btn.disabled=true;
  try{await FB.db.doc("requests/"+S.auth.email).set({email:S.auth.email,name,note,at:new Date().toISOString(),status:"pending"});toast("Request sent")}
  catch(e){console.error(e);toast("Couldn't send the request.");if(btn)btn.disabled=false}
}
async function decideRequest(id,role){
  const r=(S.reqs||{})[id]||{};
  try{if(role){await FB.db.doc("roles/"+id).set({email:id,role,name:r.name||"",addedAt:new Date().toISOString(),addedBy:S.auth.email})}
    await FB.db.doc("requests/"+id).delete();toast(role?`${r.name||id} approved (${({viewer:"view only",editor:"full access"})[role]||"admin"})`:"Request rejected")}
  catch(e){console.error(e);toast("Couldn't update the request.")}
}
document.addEventListener("submit",e=>{if(e.target.id==="req-form"){e.preventDefault();sendRequest()}});
document.addEventListener("click",e=>{const t=e.target.closest("[data-reqok],[data-reqno],[data-reqcancel]");if(!t)return;
  if(t.dataset.reqok)decideRequest(t.dataset.reqok,t.dataset.role);
  else if(t.dataset.reqno)decideRequest(t.dataset.reqno,null);
  else FB.db.doc("requests/"+S.auth.email).delete().then(()=>toast("Request withdrawn")).catch(()=>toast("Couldn't withdraw the request."))});
function setupPage(){return `<div class="empty"><h2 style="font-size:17px;margin-bottom:6px">Firebase is not set up yet</h2>Open this file in a text editor and paste your Firebase web config into <code>FIREBASE_CONFIG</code> near the top of the script.</div>`}
function importPage(){return `<section style="max-width:640px;margin:30px auto"><form class="panel" id="imp-form" style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:18px">Import portal data</h2>
  <div class="faint" style="font-size:13px">The database is empty. Choose <strong>genco-portal-data.json</strong> (the export from the Claude portal) to load positions, successor benches, syndication, talent cards and the staff directory.</div>
  <input type="file" id="imp-file" accept=".json,application/json" required><button class="btn primary" type="submit">Import</button><div id="imp-status" class="faint" style="font-size:13px"></div></form></section>`}
async function importData(){
  const f=$("#imp-file").files[0];if(!f)return;const st=$("#imp-status");const btn=$("#imp-form button");btn.disabled=true;
  try{const data=JSON.parse(await f.text());const jobs=[];
    for(const col of ["positions","pools","sync","log","meta","staff","talentCards"])for(const [id,doc] of Object.entries(data[col]||{}))jobs.push([col,id,doc]);
    let done=0;for(let i=0;i<jobs.length;i+=40){const b=FB.db.batch();jobs.slice(i,i+40).forEach(([c,id,d])=>b.set(FB.db.doc(c+"/"+id),d));await b.commit();done=Math.min(jobs.length,i+40);st.textContent=`Imported ${done} of ${jobs.length} records…`}
    st.textContent=`Done — ${jobs.length} records imported.`;toast("Import complete")}
  catch(e){console.error(e);st.textContent="Import failed: "+(e.message||e);btn.disabled=false}
}
function syncNotice(inline){
  if(S.syncState!=="off")return "";
  const h=`<span>Can't reach the database (check internet or Firebase settings).</span><button class="btn" data-retrysync>Retry sync</button>`;
  return inline?`<div class="sync-note">${h}</div>`:`<div id="sync-banner">${h}</div>`;
}
S.syncState="connecting";S.unsubs=[];
let FB=null;
async function connect(){
  if(!FB){
    if(!FIREBASE_CONFIG.apiKey){S.cfgMissing=true;S.syncState="on";render();return}
    if(!window.firebase){S.syncState="off";render();return}
    firebase.initializeApp(FIREBASE_CONFIG);FB={auth:firebase.auth(),db:firebase.firestore()};S.db=FB.db;
    try{await FB.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)}catch(e){}
    FB.auth.onAuthStateChanged(u=>onAuth(u));return;
  }
  onAuth(FB.auth.currentUser);
}
async function onAuth(u){
  S.unsubs.forEach(x=>{try{x()}catch(e){}});S.unsubs=[];
  S.positions={};S.pools={};S.syncs={};S.log=[];S.people={};S.tc.cards={};S.tc.admins={};S.staffChunks={};S.staff=[];S.staffIdx={};S.staffById={};
  S.loaded.p=S.loaded.q=false;S.tc.loaded=S.tc.adminsLoaded=false;S.syncState="on";
  if(!u){setAuth({role:null,email:""});S.me={email:"",isOwner:false,id:null};S.authReady=true;$("#who").innerHTML="<span></span>";render();updateWho();return}
  const em=(u.email||"").toLowerCase();let role=null;
  if(em===OWNER_EMAIL.toLowerCase()){if(u.emailVerified)role="owner";else{toast("Owner: use 'Sign in with Google'.");try{await FB.auth.signOut()}catch(e){}return}}
  else{try{const r=await FB.db.doc("roles/"+em).get();if(r.exists){const rr=r.data()?.role||"admin";const trusted=u.emailVerified||em.endsWith("@"+USERNAME_DOMAIN);role=rr==="viewer"||rr==="editor"?(trusted?rr:null):"admin"}}catch(e){console.warn(e)}}
  if(!role&&u.emailVerified&&em)role="pending";
  if(!role){toast("This account has no access to the portal.");try{await FB.auth.signOut()}catch(e){}return}
  setAuth({role,email:em});S.me={email:em,isOwner:role==="owner",id:u.uid,name:em};S.uid=u.uid;S.canWrite=role==="owner"||role==="admin"||role==="editor";S.canWriteKnown=true;S.authReady=true;S.fbUser=u;
  S.tab=role==="owner"||role==="viewer"||role==="editor"?"overview":"talentcard";S.tc.view="list";
  $("#who").innerHTML="<span></span>";
  const db=FB.db;
  const fail=e=>{console.error(e);S.syncState="off";render();};
  const safeRender=()=>{updateWho();if(S.editing)return renderTabs();render()};
  const sub=(ref,fn)=>S.unsubs.push(ref.onSnapshot(fn,fail));
  if(role==="pending"){S.req=undefined;S.loaded.p=S.loaded.q=true;
    S.unsubs.push(db.doc("requests/"+em).onSnapshot(s=>{S.req=s.exists?s.data():null;render()},e=>{console.warn(e);S.req=null;render()}));
    S.unsubs.push(db.doc("roles/"+em).onSnapshot(s=>{if(s.exists){toast("Access approved");onAuth(FB.auth.currentUser)}},()=>{}));
    render();updateWho();return}
  if(role==="owner"||role==="viewer"||role==="editor"){
    sub(db.collection("positions"),s=>{S.positions={};s.docs.forEach(d=>S.positions[d.id]=d.data());S.loaded.p=true;safeRender()});
    sub(db.collection("pools"),s=>{S.pools={};s.docs.forEach(d=>S.pools[d.id]=d.data());S.loaded.q=true;safeRender()});
    sub(db.doc("meta/profiles"),s=>{S.people=s.data()?.people||{};if(!S.editing)render()});
    sub(db.collection("sync"),s=>{S.syncs={};s.docs.forEach(d=>S.syncs[d.id]=d.data());if(!S.syncYear){const ys=Object.values(S.syncs).map(r=>+r.year);S.syncYear=ys.includes(NOW.getFullYear())||!ys.length?NOW.getFullYear():Math.max(...ys)}if(S.tab==="sync"&&!S.editing)render()});
    sub(db.collection("log").orderBy("at","desc").limit(80),s=>{S.log=s.docs.map(d=>d.data());if(S.tab==="log")render()});
    if(role==="owner"){S.reqs={};sub(db.collection("requests"),s=>{S.reqs={};s.docs.forEach(d=>S.reqs[d.id]=d.data());if(!S.editing)render()});
    sub(db.collection("roles"),s=>{S.tc.admins={};s.docs.forEach(d=>{const v=d.data();S.tc.admins[(v.email||d.id).toLowerCase()]=v});S.tc.adminsLoaded=true;safeRender()});}else{S.tc.admins={};S.tc.adminsLoaded=true}
  }else{S.loaded.p=S.loaded.q=true;S.tc.admins={[em]:{email:em}};S.tc.adminsLoaded=true}
  sub(db.collection("staff"),s=>{S.staffChunks={};s.docs.forEach(d=>S.staffChunks[d.id]=d.data()?.rows||[]);staffLoaded();if(!S.editing)render()});
  sub(db.doc("meta/staffinfo"),s=>{S.staffInfo=s.data()||null});
  sub(db.collection("talentCards"),s=>{S.tc.cards={};s.docs.forEach(d=>S.tc.cards[d.id]=d.data());S.tc.loaded=true;safeRender()});
  render();updateWho();
}
function updateWho(){const sp=$("#who span");if(!sp)return;const role={owner:"owner",admin:"admin",viewer:"view only",editor:"full access",pending:"awaiting access",staff:"staff"}[S.auth.role];sp.textContent=role?((S.auth.email||"").replace("@"+USERNAME_DOMAIN,"")+" · "+role):"Not signed in";let b=$("#who [data-tcsignout]");if(S.auth.role&&!b){b=document.createElement("button");b.className="btn ghost who-out";b.setAttribute("data-tcsignout","");b.textContent="Sign out";$("#who").appendChild(b)}else if(!S.auth.role&&b)b.remove()}
render();connect();
</script>

</html>
