<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Genco Succession Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky masthead + track tabs; overview = summary tiles, attention list, readiness bars; track views = editable position cards with successor benches */
:root{
  --tnb-blue:#005dab; --tnb-blue-deep:#003f7d; --tnb-orange:#e54125;
  --bg:#f2f6fb; --surface:#ffffff; --sunk:#e6eef7; --line:#cfdcea; --ink:#0d2440; --ink-2:#44597a; --ink-3:#7a8ba3;
  --accent:#005dab; --accent-ink:#ffffff; --accent-soft:#dbe8f6; --hot:#e54125; --hot-soft:#fde4de;
  --mast:#005dab; --mast-ink:#ffffff; --mast-ink-2:#cfe0f3;
  --r0:#1d8a4e; --r0-soft:#dcf1e4; --r1:#e07b12; --r1-soft:#fcebd6; --r2:#c62828; --r2-soft:#fbe0e0;
  --crit:#d4351c; --crit-soft:#fbe1dc;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --radius:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#081628; --surface:#0f2138; --sunk:#152b46; --line:#23405f; --ink:#e6eef8; --ink-2:#a6b9d2; --ink-3:#7f94b0;
  --accent:#4f9be6; --accent-ink:#06121f; --accent-soft:#12345a; --hot:#ff6a4d; --hot-soft:#46201a;
  --mast:#003f7d; --mast-ink:#ffffff; --mast-ink-2:#a9c6e6;
  --r0:#52c585; --r0-soft:#143a27; --r1:#f2a24b; --r1-soft:#40300f; --r2:#ff6b6b; --r2-soft:#4a1c1f;
  --crit:#ff7a62; --crit-soft:#46201a;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#081628; --surface:#0f2138; --sunk:#152b46; --line:#23405f; --ink:#e6eef8; --ink-2:#a6b9d2; --ink-3:#7f94b0;
  --accent:#4f9be6; --accent-ink:#06121f; --accent-soft:#12345a; --hot:#ff6a4d; --hot-soft:#46201a;
  --mast:#003f7d; --mast-ink:#ffffff; --mast-ink-2:#a9c6e6;
  --r0:#52c585; --r0-soft:#143a27; --r1:#f2a24b; --r1-soft:#40300f; --r2:#ff6b6b; --r2-soft:#4a1c1f;
  --crit:#ff7a62; --crit-soft:#46201a;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

@media (max-width:600px){header.mast{position:static!important}}
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:14px 16px 0;border-bottom:1px solid var(--line)}
.mast-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:22px;font-weight:800}
.brand .yr{font-family:var(--f-mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.who img{width:24px;height:24px;border-radius:50%}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.search input:focus{outline:2px solid var(--accent);outline-offset:0}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgb(0 0 0 / .12);max-height:340px;overflow:auto;z-index:30}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.results button:hover,.results button:focus{background:var(--sunk);outline:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
nav.tabs .ct{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-left:4px}

main{padding-top:24px;display:flex;flex-direction:column;gap:28px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.section-head h2{font-size:18px}

.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.track{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left}
.track:hover{border-color:var(--accent)}
.track:focus-visible{outline:2px solid var(--accent)}
.track h3{font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink-2)}
.stack{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--sunk);gap:2px}
.stack span{display:block;height:100%}
.s0{background:var(--r0)} .s1{background:var(--r1)} .s2{background:var(--r2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.alert-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.alert-list li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.alert-list li:first-child{border-top:0}
.flag{font-family:var(--f-display);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.flag.crit{background:var(--crit-soft);color:var(--crit)}
.flag.warn{background:var(--r1-soft);color:var(--r1)}
.flag.info{background:var(--accent-soft);color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr 30px;gap:10px;align-items:center;font-size:13px}
.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.bar-row .nm:hover{color:var(--accent);text-decoration:underline}
.bar-row .track-bar{display:flex;height:14px;gap:2px}
.bar-row .track-bar span{height:100%;border-radius:2px}
.bar-row .tot{text-align:right;color:var(--ink-2)}
.axis{display:grid;grid-template-columns:minmax(110px,190px) 1fr 30px;gap:10px;font-size:11px;color:var(--ink-3);margin-top:4px}
.axis div:nth-child(2){display:flex;justify-content:space-between}

.ppl{list-style:none;margin:0;padding:0}
.ppl li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:center}
.ppl li:first-child{border-top:0}
.linkish{background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left;font-weight:600}
.linkish:hover{color:var(--accent);text-decoration:underline}
.linkish:focus-visible{outline:2px solid var(--accent)}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.c0{background:var(--r0-soft);color:var(--r0)} .c1{background:var(--r1-soft);color:var(--r1)} .c2{background:var(--r2-soft);color:var(--r2)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column}
.card.flagged{border-left:4px solid var(--crit)}
.card-h{padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px}
.card-h .top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.card-h h3{font-size:15.5px;line-height:1.25}
.card-h .full{font-size:12px;color:var(--ink-3)}
.inc{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink-2)}
.inc strong{color:var(--ink);font-weight:600}
.vac{color:var(--crit);font-weight:700}
.bench{border-top:1px solid var(--line);padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px}
.tier{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start}
.tier .t{font-family:var(--f-mono);font-size:11.5px;font-weight:500;padding:2px 0;text-align:center;border-radius:3px}
.tier ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.tier li{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.tier li .g{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.tier li .note{font-size:11.5px;color:var(--accent)}
.tier .none{color:var(--ink-3);font-size:13px;font-style:italic}
.card-f{border-top:1px solid var(--line);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);margin-top:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:default}

.cat-block{display:flex;flex-direction:column;gap:12px}
.cat-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.cat-grid{grid-template-columns:1fr}}
.l2sum-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:8px 0}
.l2sum-kpis>div{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--radius);padding:6px 10px}
.l2sum-kpis .v{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.1}
.l2sum-kpis .l{font-size:12px;color:var(--ink-2)}
.l2sum-kpis>.bad{border-top-color:var(--crit)} .l2sum-kpis .bad .v{color:var(--crit)}
.l2sum-kpis>.warn{border-top-color:var(--r1)} .l2sum-kpis .warn .v{color:var(--r1)}
.l2sum{font-size:12.5px}
.l2sum td,.l2sum th{vertical-align:middle;padding:4px 8px;white-space:nowrap;line-height:1.3}
.l2sum th{padding:6px 8px;font-size:10.5px}
.l2sum td .linkish{white-space:normal;text-align:left}
.l2sum td.pn{white-space:normal;min-width:140px;max-width:230px}
.l2sum td.incn,.l2sum td.incn .linkish{white-space:nowrap}
.l2sum .linkish{display:inline;padding:0;margin:0;line-height:1.3;vertical-align:baseline;border:0}
.l2sum .flag{font-size:9.5px;padding:1px 5px}
.l2sum .status{font-size:11.5px}
.l2sum td.n{text-align:center;font-family:var(--f-mono)}
.l2sum td.n.zero{color:var(--ink-3)}
.l2sum tr.crit td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.subhead{margin:26px 0 4px}
@media (max-width:760px){.l2sum-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.login-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.login-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.login-owner{border-top:3px solid var(--tnb-orange)}
@media (max-width:820px){.login-grid,.login-grid.three{grid-template-columns:1fr}}
.who .who-out{margin-left:6px;padding:3px 10px;font-size:12px;color:var(--mast-ink);border-color:rgba(255,255,255,.5);background:transparent}
.sf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.sf-grid{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.act{text-align:right;white-space:nowrap}
.status{font-size:12px}
.status.bad{color:var(--crit);font-weight:600}
.status.warn{color:var(--r1);font-weight:600}

/* editing */
.edit-grid{display:flex;flex-direction:column;gap:6px}
.erow{display:grid;grid-template-columns:62px minmax(0,1fr) 66px 28px;gap:6px;align-items:center}
.erow.wide{grid-template-columns:62px minmax(0,1fr) 66px minmax(0,.8fr) 28px}
@media (max-width:520px){.erow.wide{grid-template-columns:62px minmax(0,1fr) 28px}.erow.wide .opt{display:none}}
.erow input,.erow select,.field input,.field select{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-size:13px}
.erow input:focus,.erow select:focus,.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.x{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:18px;line-height:1;border-radius:4px}
.x:hover{color:var(--crit);background:var(--crit-soft)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.field label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:2px;font-weight:600}
@media (min-width:760px){.cards .card.editing{grid-column:span 2}}
.edit-sec{display:flex;flex-direction:column;gap:8px}
.edit-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 64px)}
dialog::backdrop{background:rgb(10 20 24 / .45)}
.dlg-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:start}
.dlg-b{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.kv{grid-template-columns:repeat(2,1fr)}}
.kv div{background:var(--sunk);border-radius:6px;padding:8px 10px}
.kv .v{font-family:var(--f-display);font-weight:700;font-size:18px}
.kv .l{font-size:11px;color:var(--ink-2)}
ol.exp{margin:0;padding-left:20px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}

.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start;font-size:13.5px}
.log li:first-child{border-top:0}
.log img{width:24px;height:24px;border-radius:50%}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13.5px;z-index:50;box-shadow:0 6px 20px rgb(0 0 0 / .2)}
.ro-note{font-size:12.5px;color:var(--ink-2);background:var(--sunk);border-radius:6px;padding:6px 10px}
@media (prefers-reduced-motion:no-preference){.card,.track{transition:border-color .15s}}

header.mast{background:var(--mast)!important;border-bottom:4px solid var(--tnb-orange)!important;color:var(--mast-ink)}
.brand{align-items:center}
.brand .logo{background:#fff;border-radius:6px;padding:4px 8px;display:flex;align-items:center}
.brand .logo img{height:34px;width:auto;display:block}
.brand h1{color:var(--mast-ink)}
.brand .yr{color:#fff;border-color:var(--tnb-orange);background:var(--tnb-orange)}
.who{color:var(--mast-ink-2)}
.search input{border-color:transparent}
nav.tabs button{color:var(--mast-ink-2)}
nav.tabs button:hover{color:#fff}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--tnb-orange)}
nav.tabs .ct{color:var(--mast-ink-2);opacity:.8}
nav.tabs button:focus-visible{outline-color:#fff}
.eyebrow{color:var(--accent)}
.track{border-top:3px solid var(--accent)}
.track:hover{border-color:var(--tnb-orange)}
.section-head h2{color:var(--ink)}
.btn.primary{background:var(--tnb-orange);border-color:var(--tnb-orange);color:#fff}
.btn.primary:hover{color:#fff}
.seg button[aria-pressed="true"]{background:var(--accent)}
.card.flagged{border-left-color:var(--tnb-orange)}
th{background:var(--sunk);color:var(--ink-2)}
.srec{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13.5px}.srec>div{display:flex;flex-direction:column}.srec>div>span:first-child{font-size:11px;color:var(--ink-3);font-weight:600}@media (max-width:420px){.srec{grid-template-columns:1fr}}
@media (max-width:600px){.brand .logo img{height:26px}}
/* Talent Card */
.tc-stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.tc-table td{vertical-align:middle}
.tc-row{cursor:pointer}
.tc-row:hover td{background:var(--sunk)}
.tc-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tc-who{display:flex;gap:10px;align-items:center}
.tc-av{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700}
.tc-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding-block:4px}
.tc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1000px){.tc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.tc-grid{grid-template-columns:1fr}.tc-p.span2{grid-column:auto!important}}
.tc-p{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0}
.tc-p.span2{grid-column:span 2}
.tc-ph{background:var(--accent);color:#fff;font-family:var(--f-display);font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:7px 12px}
.tc-pb{padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.tc-info{display:flex;gap:14px;align-items:center}
.tc-info .tc-av{border-radius:8px}
.tc-kvs{display:flex;flex-direction:column}
.tc-kv{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:4px 0;border-top:1px solid var(--line);font-size:13px}
.tc-kv:first-child{border-top:0}
.tc-kv>span:first-child{color:var(--ink-3);font-weight:600;font-size:12px}
.tc-kv>span:last-child{overflow-wrap:anywhere}
.tc-ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.tc-mini{font-size:13px}
.tc-mini th{padding:5px 6px;font-size:10.5px}
.tc-mini td{padding:5px 6px}
.tc-el{display:flex;flex-direction:column;gap:6px}
.tc-er{display:grid;gap:6px;align-items:center}
.tc-er input,.tc-er select{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-size:13px;min-width:0}
.tc-er input:focus,.tc-er select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.sync-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:10px}
#sync-banner{background:var(--r1-soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
/* Slide view: fixed white slide, same look in both themes */
#tc-slide[hidden]{display:none!important}
#tc-slide{position:fixed;inset:0;z-index:60;background:rgb(8 22 40 / .88);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sl-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;color:#fff}
.sl-bar .btn{background:#fff;color:#0d2440;border-color:#fff}
.sl-bar .btn.primary{background:var(--tnb-orange);border-color:var(--tnb-orange);color:#fff}
.sl-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0}
.sl-stage{position:relative;background:#fff;color:#0d2440;box-shadow:0 10px 40px rgb(0 0 0 / .4);font-family:var(--f-body);overflow:hidden}
.sl-head{position:absolute;left:0;top:0;right:0;height:9.5%;display:flex;align-items:center;gap:2%;padding:0 1%;border-bottom:3px solid #e54125}
.sl-head img{height:74%;width:auto}
.sl-title{font-family:var(--f-display);font-weight:800;color:#005dab;font-size:calc(var(--sl-h) * 1.7);letter-spacing:.04em;display:flex;gap:1.2em;align-items:baseline;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.sl-title span{color:#0d2440;letter-spacing:0;font-size:.85em;overflow:hidden;text-overflow:ellipsis}
.sl-date{font-size:var(--sl-h);color:#44597a}
.sl-box{position:absolute;border:1px solid #cfdcea;border-radius:4px;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.sl-h{background:#005dab;color:#fff;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:var(--sl-h);padding:.35em .6em;flex:none}
.sl-body{flex:1;min-height:0;overflow:hidden;padding:.4em .6em;line-height:1.28}
.sl-l{overflow-wrap:anywhere}
.sl-b{color:#005dab;font-weight:700;margin-top:.3em}
.sl-k{color:#44597a;font-weight:700}
.sl-more{color:#44597a;font-style:italic}
.sl-l[hidden]{display:none}
.sl-photo{align-items:center;justify-content:center;background:#dbe8f6}
.sl-photo img{width:100%;height:100%;object-fit:cover}
.sl-photo span{font-family:var(--f-display);font-weight:800;color:#005dab;font-size:calc(var(--sl-h) * 3)}
.sl-title{display:block!important;font-family:var(--f-display);font-weight:800;color:#0b2a5b;font-size:calc(var(--sl-h) * 1.9);flex:1;min-width:0;line-height:1.15;border-bottom:3px solid #8a96a3;padding-bottom:.2em}
.sl-title .sl-post{color:#005dab;font-size:.72em}
.sl-head{border-bottom:0!important}
.sl-h{background:#0b2a5b!important;text-transform:none!important;letter-spacing:.01em!important}
.sl-box:has(.sl-sub) .sl-h{background:#8b1a1a!important}
.sl-ol{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:.25em}
.sl-tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:1em}
.sl-tbl th{font-weight:700;text-decoration:underline;text-align:left;padding:.15em .3em;color:#0d2440;font-size:1em;text-transform:none;letter-spacing:0;background:none;border:0}
.sl-tbl td{padding:.18em .3em;border:0;border-bottom:1px solid #e3eaf3;vertical-align:top;overflow-wrap:anywhere}
.sl-tbl.ctr th,.sl-tbl.ctr td{text-align:center}
.sl-tbl.ctr td{font-size:1.15em}
.sl-sub{background:#0b2a5b;color:#fff;font-weight:700;padding:.15em .4em;margin:.4em 0 .2em}
.sl-src{text-align:right;font-style:italic;color:#44597a;font-size:.85em;margin-top:.4em}
.sl-photo{border:1px solid #b9c9dc!important;padding:3px;background:#fff!important}

@media print{@page{size:13.333in 7.5in;margin:0}body>*:not(#tc-slide){display:none!important}#tc-slide{position:static;background:#fff}.sl-bar{display:none}.sl-wrap{padding:0}.sl-stage{box-shadow:none}}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--line);vertical-align:1px}
</style>

const TRACKS={L2:{name:"SGM & L2 Leadership",short:"L2",unit:"position"},PGM:{name:"PGM / Subsidiary Heads",short:"PGM",unit:"category"},PDPM:{name:"Project Directors / Managers",short:"PD / PM",unit:"category"}};
const RL={R0:"Ready now",R1:"1–2 yrs",R2:"3–5 yrs"};
/* Succession data (positions, benches, syndication, activity, L2 profiles) is readable by the portal owner only (db rules). Everyone else sees Talent Card + Staff directory. */
function isOwnerSession(){return S.auth.role==="owner"&&!!S.me.isOwner}
function isViewer(){return S.auth.role==="viewer"}
function isEditor(){return S.auth.role==="editor"}
function isFull(){return isOwnerSession()||isEditor()}
function secretView(){return !(isFull()||isViewer())}
const OPEN_TABS=[["talentcard","Talent Card"],["staff","Staff directory"]];
const TABS=[["overview","Overview"],["L2","SGM & L2 Leadership"],["PGM","PGM / Subsidiary"],["PDPM","PD / PM"],["talent","Talent pool"],["talentcard","Talent Card"],["staff","Staff directory"],["sync","L2 Syndication"],["log","Activity"]];
const S={syncs:{},syncYear:null,confirmDel:null,staff:[],staffIdx:{},staffInfo:null,staffChunks:{},sf:{q:"",dept:"",g:"",lim:150},tab:"overview",positions:{},pools:{},people:{},sync:[],log:[],db:null,user:null,uid:null,canWrite:true,editing:null,filter:"all",loaded:{p:false,q:false}};
try{const t=localStorage.getItem("gsp.tab");if(t&&TABS.some(x=>x[0]===t))S.tab=t}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function norm(n){return String(n||"").toLowerCase().split("bin").join("").split("binti").join("").split(" bt ").join("").replace(/[^a-z]/g,"")}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
const rank={R0:0,R1:1,R2:2};
const sortS=a=>[...a].sort((x,y)=>(rank[x.r]??9)-(rank[y.r]??9));
function counts(list){const c={R0:0,R1:0,R2:0};(list||[]).forEach(s=>{if(c[s.r]!=null)c[s.r]++});c.t=(list||[]).length;return c}
function parseDate(s){if(!s)return null;const d=new Date(s);return isNaN(d)?null:d}
/* Age is computed live: TNB retirement date = date of birth + 60 years (holds for every executive in the staffing data). */
function ageFromRet(ret){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(ret||""));if(!m)return null;const by=+m[1]-60,bm=+m[2]-1,bd=+m[3];const n=new Date();let a=n.getFullYear()-by;if(n.getMonth()<bm||(n.getMonth()===bm&&n.getDate()<bd))a--;return a>=15&&a<=80?a:null}
function staffAge(st){return st?(ageFromRet(st.ret)??st.age??null):null}
function posAge(p){if(!p||!p.incumbent)return null;const st=S.staffIdx?.[skey(p.incumbent)];return staffAge(st)??(p.age||null)}
function tcAge(c){if(!c)return null;let st=(c.staffId&&S.staffById?.[String(c.staffId)])||null;if(st&&skey(st.n).slice(0,6)!==skey(c.name).slice(0,6))st=null;return ageFromRet(c.retirementDate)??staffAge(st)??(c.age??null)}
const NOW=new Date();
function monthsTo(d){return (d-NOW)/(1000*60*60*24*30.44)}
function fmtAgo(iso){const d=new Date(iso);const m=Math.round((Date.now()-d)/60000);if(m<1)return"just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return h+" h ago";return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
const posList=tr=>Object.entries(S.positions).map(([id,p])=>({id,...p})).filter(p=>!tr||p.track===tr).sort((a,b)=>a.order-b.order);
const poolList=tr=>Object.entries(S.pools).map(([id,p])=>({id,...p})).filter(p=>!tr||p.track===tr);
const isVacant=p=>!p.incumbent||/vacant/i.test(p.incumbent);

function risks(p){
  const r=[];const pool=S.pools[p.pool];const c=counts(pool?.successors);
  if(isVacant(p))r.push(["crit","Vacant",p.status||"Position vacant"]);
  const d=parseDate(p.retire);
  if(d&&monthsTo(d)<=18)r.push([monthsTo(d)<=6?"crit":"warn","Retiring",`${p.retire}`]);
  else if(!d&&posAge(p)>=58&&!isVacant(p))r.push(["warn","Age "+posAge(p),"Near retirement age"]);
  if(p.track==="L2"&&c.R0===0)r.push(["crit","No R0","No ready-now successor"]);
  return r;
}

/* ---------- rendering ---------- */
function renderTabs(){
  const n={L2:posList("L2").length,PGM:posList("PGM").length,PDPM:posList("PDPM").length};
  const restricted=tcRestricted();document.querySelector(".search").hidden=restricted;
  const tabs=(!S.auth.role||S.auth.role==="pending")?[]:restricted?[["talentcard","My Talent Card"]]:secretView()?OPEN_TABS:TABS;
  if(!S.auth.role)document.querySelector(".search").hidden=true;
  if(S.auth.role&&S.auth.role!=="pending"&&!restricted&&secretView()&&!OPEN_TABS.some(t=>t[0]===S.tab))S.tab="talentcard";
  $("#tabs").innerHTML=tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${esc(l)}${n[k]!=null?`<span class="ct">${n[k]}</span>`:""}</button>`).join("");
}
function render(){
  if(S.auth.role==="owner"&&S.me.id&&!S.me.isOwner)setAuth({role:null,email:""});
  renderTabs();updateWho();
  const m=$("#main");
  if(!S.auth.role){m.innerHTML=(S.cfgMissing?setupPage():S.authReady?loginPage():`<div class="empty">Loading…</div>`)+syncNotice();return}
  if(S.auth.role==="pending"){m.innerHTML=requestPage();return}
  if(tcRestricted())S.tab="talentcard";
  const rq=isOwnerSession()?requestsBanner():"";
  if(S.tab==="talentcard"){m.innerHTML=rq+vTC()+syncNotice();return}
  if(S.tab==="staff"&&secretView()){m.innerHTML=vStaff()+syncNotice();return}
  if(!S.loaded.p||!S.loaded.q){m.innerHTML=`<div class="empty">Loading succession data…</div>`+syncNotice();return}
  if(!Object.keys(S.positions).length&&isOwnerSession()){m.innerHTML=importPage()+syncNotice();return}
  if(!Object.keys(S.positions).length){m.innerHTML=`<div class="empty"><h2 style="font-size:17px;margin-bottom:6px">No positions yet</h2>Succession data appears here once it is loaded into the portal.</div>`+syncNotice();return}
  const f={overview:vOverview,L2:()=>vTrack("L2"),PGM:()=>vTrack("PGM"),PDPM:()=>vTrack("PDPM"),talent:vTalent,staff:vStaff,sync:vSync,log:vLog}[S.tab];
  m.innerHTML=rq+f()+syncNotice();
  if(S.tab==="log")paintLogNames();
}
function stackBar(c,h){const t=c.R0+c.R1+c.R2||1;return `<div class="stack" style="${h?`height:${h}px`:""}" role="img" aria-label="R0 ${c.R0}, R1 ${c.R1}, R2 ${c.R2}">${["R0","R1","R2"].map((k,i)=>c[k]?`<span class="s${i}" style="flex:${c[k]}"></span>`:"").join("")}</div>`}
const legend=`<div class="legend"><span><i class="s0"></i>R0 Ready now</span><span><i class="s1"></i>R1 1–2 yrs</span><span><i class="s2"></i>R2 3–5 yrs</span></div>`;

function vOverview(){
  const tiles=Object.keys(TRACKS).map(tr=>{
    const ps=posList(tr),pools=poolList(tr);const c={R0:0,R1:0,R2:0,t:0};
    pools.forEach(p=>{const x=counts(p.successors);c.R0+=x.R0;c.R1+=x.R1;c.R2+=x.R2;c.t+=x.t});
    const vac=ps.filter(isVacant).length;
    const noR0=tr==="L2"?ps.filter(p=>counts(S.pools[p.pool]?.successors).R0===0).length:pools.filter(p=>counts(p.successors).R0===0).length;
    const people=new Set(pools.flatMap(p=>(p.successors||[]).map(s=>norm(s.n)))).size;
    return `<button class="track" data-tab="${tr}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><h3>${esc(TRACKS[tr].name)}</h3><span class="eyebrow">${tr==="L2"?"per position":"per category"}</span></div>
      <div class="stats num">
        <div class="stat"><div class="v">${ps.length}</div><div class="l">Positions${vac?` · <span class="vac">${vac} vacant</span>`:""}</div></div>
        <div class="stat"><div class="v">${c.t}</div><div class="l">Nominations</div></div>
        <div class="stat"><div class="v">${people}</div><div class="l">Unique people</div></div>
      </div>
      ${stackBar(c)}
      <div class="legend num" style="justify-content:space-between"><span><i class="s0"></i>R0 ${c.R0}</span><span><i class="s1"></i>R1 ${c.R1}</span><span><i class="s2"></i>R2 ${c.R2}</span>${noR0?`<span class="flag crit">${noR0} without R0</span>`:`<span class="flag info">All have R0</span>`}</div>
    </button>`}).join("");

  const alerts=posList().flatMap(p=>risks(p).map(r=>({p,r}))).sort((a,b)=>(a.r[0]==="crit"?0:1)-(b.r[0]==="crit"?0:1));
  const alertHtml=alerts.length?`<ul class="alert-list">${alerts.map(({p,r})=>`<li><span class="flag ${r[0]}">${esc(r[1])}</span><div><button class="linkish" data-goto="${p.track}" data-pos="${p.id}">${esc(p.role)}</button><div class="faint" style="font-size:12.5px">${TRACKS[p.track].short} · ${esc(p.incumbent||"—")} · ${esc(r[2])}</div></div><span class="faint mono">${esc(p.pgrade||"")}</span></li>`).join("")}</ul>`:`<div class="muted">Nothing needs attention.</div>`;

  const l2=posList("L2").map(p=>({p,c:counts(S.pools[p.pool]?.successors)}));
  const max=Math.max(5,...l2.map(x=>x.c.t));const top=Math.ceil(max/5)*5;
  const bars=l2.map(({p,c})=>`<div class="bar-row"><button class="nm" data-goto="L2" data-pos="${p.id}" title="${esc(p.role)}">${esc(p.role)}</button><div class="track-bar" style="width:${c.t/top*100}%">${["R0","R1","R2"].map((k,i)=>c[k]?`<span class="s${i}" style="flex:${c[k]}" title="${k}: ${c[k]}"></span>`:"").join("")}</div><span class="tot num">${c.t}</span></div>`).join("");
  const ticks=[0,top/5,2*top/5,3*top/5,4*top/5,top].map(t=>`<span>${t}</span>`).join("");

  const multi=talentRows().filter(x=>x.noms.length>1).slice(0,10);
  return `
  <section><div class="section-head"><div><div class="eyebrow">Succession coverage</div><h2>Three succession tracks at a glance</h2></div><div class="toolbar"><button class="btn" data-exp="xlsx:ALL" title="All tracks as Excel">⬇ Excel (all)</button><button class="btn" data-exp="pptx:ALL" title="All tracks as PowerPoint">⬇ PPT (all)</button>${legend}</div></div><div class="tracks">${tiles}</div></section>
  <section class="two">
    <div class="panel"><div class="section-head"><h2>Needs attention</h2><span class="faint" style="font-size:12.5px">${alerts.length} flags · retirements within 18 months</span></div>${alertHtml}</div>
    <div class="panel"><div class="section-head"><h2>L2 bench depth</h2><span class="faint" style="font-size:12.5px">successors per position</span></div><div class="bars">${bars}</div><div class="axis num"><div></div><div>${ticks}</div><div></div></div></div>
  </section>
  <section class="panel"><div class="section-head"><div><h2>Most-nominated talent</h2><div class="faint" style="font-size:12.5px">People named as successor for more than one position or category</div></div><button class="btn" data-tab="talent">Full talent pool</button></div>
    <ul class="ppl">${multi.map(x=>`<li><button class="linkish" data-person="${esc(x.name)}">${esc(x.name)}</button><div class="chips">${x.noms.map(n=>`<span class="chip c${rank[n.r]}" title="${esc(n.label)}">${esc(shortLabel(n))} ${n.r}</span>`).join("")}</div></li>`).join("")}</ul>
  </section>`;
}
function shortLabel(n){return n.track==="L2"?n.label.replace(/^Head /,"H. ").replace(/[()]/g,""):TRACKS[n.track].short+" "+n.label.replace(/[()]/g,"")}

function talentRows(){
  const m={};
  poolList().forEach(pl=>(pl.successors||[]).forEach(s=>{const k=norm(s.n);if(!k)return;(m[k]??={name:s.n,noms:[],g:""}).noms.push({r:s.r,label:pl.label,track:pl.track,pool:pl.id});if(s.g&&!m[k].g)m[k].g=s.g}));
  Object.values(m).forEach(x=>x.noms.sort((a,b)=>rank[a.r]-rank[b.r]));
  return Object.values(m).sort((a,b)=>b.noms.length-a.noms.length||(rank[a.noms[0].r]-rank[b.noms[0].r])||a.name.localeCompare(b.name));
}

function benchView(pool,{wide}={}){
  const list=sortS(pool?.successors||[]);
  return ["R0","R1","R2"].map((k,i)=>{const xs=list.filter(s=>s.r===k);return `<div class="tier"><span class="t c${i}">${k}</span>${xs.length?`<ul>${xs.map(s=>`<li><button class="linkish" style="font-weight:500" data-person="${esc(s.n)}">${esc(s.n)}</button>${s.g?`<span class="g">${esc(s.g)}</span>`:""}${s.note?`<span class="note">${esc(s.note)}</span>`:""}</li>`).join("")}</ul>`:`<span class="none">None named</span>`}</div>`}).join("");
}
function benchEdit(pool,key){
  const list=sortS(pool?.successors||[]);
  const row=(s,i)=>`<div class="erow wide" data-i="${i}"><select aria-label="Readiness" data-f="r">${["R0","R1","R2"].map(k=>`<option ${s.r===k?"selected":""}>${k}</option>`).join("")}</select><input data-f="n" list="staffnames" autocomplete="off" value="${esc(s.n)}" placeholder="Successor name" aria-label="Successor name"><input data-f="g" value="${esc(s.g||"")}" placeholder="Grade" aria-label="Grade"><input class="opt" data-f="note" value="${esc(s.note||"")}" placeholder="Note" aria-label="Note"><button class="x" data-rm title="Remove successor" aria-label="Remove successor">×</button></div>`;
  return `<div class="edit-grid" data-bench="${key}">${list.map(row).join("")}</div><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-add>+ Add successor</button><span class="faint" style="font-size:12px">Blank names are dropped on save</span></div>`;
}
const POS_ST=["In post","Acting","Retiring","Vacant","Advertised","Shortlisting","Awaiting JIK approval","Position on hold","Other"];
function catsOf(tr){const m={};posList(tr).forEach(p=>{if(p.cat&&!m[p.cat])m[p.cat]=p.pool});return m}
function incEdit(p){
  const f=(k,lab,v,extra="")=>`<div class="field"><label for="f-${k}-${p.id}">${lab}</label><input id="f-${k}-${p.id}" data-f="${k}" value="${esc(v??"")}" ${extra}></div>`;
  const cats=p.track!=="L2"?Object.keys(catsOf(p.track)):[];
  const st=POS_ST.includes(p.status)?p.status:(p.status?"Other":"In post");
  return `<div class="edit-sec" data-incform>
    <div class="eyebrow">Position</div>
    <div class="fields">
      <div class="field" style="grid-column:span 2"><label for="f-role-${p.id}">Position name</label><input id="f-role-${p.id}" data-f="role" value="${esc(p.role)}"></div>
      ${p.track==="L2"?f("full","Full title",p.full,'placeholder="Optional"'):`<div class="field"><label for="f-cat-${p.id}">Category</label><select id="f-cat-${p.id}" data-f="cat">${cats.map(c=>`<option ${c===p.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`}
      ${f("pgrade","Position grade",p.pgrade,'placeholder="e.g. J00, M16"')}
      <div class="field"><label for="f-status-${p.id}">Status</label><select id="f-status-${p.id}" data-f="status">${POS_ST.map(x=>`<option ${st===x?"selected":""}>${x}</option>`).join("")}</select></div>
      ${f("stNote","Status note",p.stNote,'placeholder="e.g. Close 24 Aug 26"')}
    </div>
    <div class="eyebrow" style="margin-top:6px">Incumbent</div>
    <div class="fields">
      <div class="field" style="grid-column:span 2"><label for="f-incumbent-${p.id}">Name</label><input id="f-incumbent-${p.id}" data-f="incumbent" list="staffnames" autocomplete="off" value="${esc(p.incumbent)}" placeholder="Leave blank if vacant"></div>
      ${f("grade","Incumbent grade",p.grade)}${f("age","Age",p.age,'type="number" min="18" max="70"')}${f("jik","JIK approval",p.jik,'placeholder="MM/YYYY"')}${f("retire","Retirement date",p.retire,'placeholder="e.g. 13 Oct 2027"')}
    </div>
    ${S.canWrite?`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${S.confirmDel===p.id?`<span class="faint" style="font-size:13px">Delete ${esc(p.role)}${p.track==="L2"?" and its successor list":""}?</span><button class="btn danger" data-posdel="${p.id}">Yes, delete</button><button class="btn" data-posdelno>Keep</button>`:`<button class="btn ghost danger" data-posdelask="${p.id}">Delete position</button>`}</div>`:""}
  </div>`;
}
function statusLine(p){
  const s=p.status||"In post";const bad=["Vacant","Advertised","Shortlisting","Awaiting JIK approval","Position on hold"].includes(s)||isVacant(p);
  const warn=s==="Retiring"||s==="Acting";
  if(s==="In post"&&!p.stNote)return "";
  return `<span class="status ${bad?"bad":warn?"warn":"muted"}">${esc(s)}</span>${p.stNote?`<span class="faint" style="font-size:12px"> · ${esc(p.stNote)}</span>`:""}`;
}
function editedLine(o){return o?.updatedAt?`<span data-uid="${esc(o.updatedBy||"")}" data-when="${esc(o.updatedAt)}">Edited ${fmtAgo(o.updatedAt)}</span>`:`<span>From 2026 workbook</span>`}

function vTrack(tr){
  const ps=posList(tr);
  const ro=S.canWrite?"":`<div class="ro-note">Read-only view. Only the portal owner can change the succession plan.</div>`;
  const filt=`<div class="seg" role="group" aria-label="Filter">${[["all","All"],["flag","Flagged"],["vacant","Vacant"]].map(([k,l])=>`<button data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("")}</div>`;
  const pass=p=>S.filter==="all"||(S.filter==="vacant"?isVacant(p):risks(p).length>0);
  const head=`<div class="section-head"><div><div class="eyebrow">${tr==="L2"?"Successors named per position":"Successors named per category; one person can sit in several categories"}</div><h2>${esc(TRACKS[tr].name)}</h2></div><div class="toolbar">${filt}${S.canWrite?`<button class="btn primary" data-posadd="${tr}">+ Add position</button>`:""}<button class="btn" data-exp="xlsx:${tr}" title="Download successor list as Excel">⬇ Excel</button><button class="btn" data-exp="pptx:${tr}" title="Download successor list as PowerPoint">⬇ PPT</button>${legend}</div></div>${ro}`;
  if(tr==="L2"){
    return `<section>${head}${l2Summary(ps.filter(pass))}<div class="subhead"><div class="eyebrow">Successor detail</div><h3 style="font-size:17px">Position cards</h3></div><div class="cards" style="margin-top:12px">${ps.filter(pass).map(p=>l2Card(p)).join("")||`<div class="empty">No positions match this filter.</div>`}</div></section>`;
  }
  const cats=[...new Set(ps.map(p=>p.cat))];
  return `<section>${head}<div style="display:flex;flex-direction:column;gap:30px;margin-top:14px">${cats.map(cat=>{
    const cps=ps.filter(p=>p.cat===cat).filter(pass);const pool=S.pools[ps.find(p=>p.cat===cat).pool];const poolId=ps.find(p=>p.cat===cat).pool;
    if(!cps.length)return"";
    const c=counts(pool?.successors);
    const ed=S.editing==="pool:"+poolId;
    return `<div class="cat-block"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h3 style="font-size:16px">${esc(cat)}</h3><span class="faint num" style="font-size:13px">${ps.filter(p=>p.cat===cat).length} positions · ${c.t} successors</span></div>
    <div class="cat-grid">
      <div class="tbl-wrap"><table><thead><tr><th>Position</th><th>Pos. gr.</th><th>Incumbent</th><th>Status</th><th></th></tr></thead><tbody>${cps.map(p=>posRow(p)).join("")}</tbody></table></div>
      <div class="card" data-poolcard="${poolId}"><div class="card-h"><div class="top"><h3>Successor bench</h3><span class="faint num" style="font-size:12px">R0 ${c.R0} · R1 ${c.R1} · R2 ${c.R2}</span></div>${stackBar(c,6)}</div>
        <div class="bench">${ed?benchEdit(pool,poolId):benchView(pool)}</div>
        <div class="card-f">${editedLine(pool)}${ed?`<div class="edit-actions"><button class="btn" data-cancel>Cancel</button><button class="btn primary" data-savepool="${poolId}">Save bench</button></div>`:(S.canWrite?`<button class="btn" data-edit="pool:${poolId}">Edit successors</button>`:"")}</div>
      </div>
    </div></div>`}).join("")}</div></section>`;
}
function posRow(p){
  const ed=S.editing==="pos:"+p.id;
  if(ed)return `<tr data-posrow="${p.id}"><td colspan="5"><div style="display:flex;flex-direction:column;gap:10px">${incEdit(p)}<div class="edit-actions"><button class="btn" data-cancel>Cancel</button><button class="btn primary" data-savepos="${p.id}">Save</button></div></div></td></tr>`;
  const rk=risks(p);const vac=isVacant(p);const ret=rk.find(r=>r[1]==="Retiring");
  const st=[ret?`<span class="status ${ret[0]==="crit"?"bad":"warn"}">Retires ${esc(p.retire)}</span>`:"",statusLine(p)||(vac?`<span class="status bad">Vacant</span>`:ret?"":`<span class="status muted">In post</span>`)].filter(Boolean).join("<br>");
  return `<tr id="pos-${p.id}"><td><strong style="font-weight:600">${esc(p.role)}</strong></td><td class="mono">${esc(p.pgrade||"")}</td><td>${vac?`<span class="vac">VACANT</span>`:`<button class="linkish" style="font-weight:500" data-person="${esc(p.incumbent)}">${esc(p.incumbent)}</button><div class="faint mono" style="font-size:11.5px">${esc(p.grade||"")}${posAge(p)?` · age ${posAge(p)}`:""}</div>`}</td><td>${st}</td><td class="act">${S.canWrite?`<button class="btn ghost" data-edit="pos:${p.id}" aria-label="Edit ${esc(p.role)}">Edit</button>`:""}</td></tr>`;
}
function incRet(p){const st=S.staffIdx?.[skey(p.incumbent||"")];return st?.ret||(parseDate(p.retire)?p.retire:"")}
function l2Summary(ps){

      ${rk.length&&!ed?`<div style="display:flex;gap:6px;flex-wrap:wrap">${rk.map(r=>`<span class="flag ${r[0]}" title="${esc(r[2])}">${esc(r[1])}</span>`).join("")}</div>`:""}

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function skey(n){return String(n||"").toLowerCase().replace(/\b(dato'?|datuk|dr|ir|ts|haji|hj)\b\.?/g," ").replace(/\b(bin|binti|bt|b|a\/l|a\/p)\b/g," ").replace(/[^a-z]/g,"")}
function fmtD(iso){if(!iso)return"—";const [y,m,d]=iso.split("-");return `${+d} ${MON[+m-1]} ${y}`}
function retSoon(iso){const d=parseDate(iso);return d&&monthsTo(d)<=18&&monthsTo(d)>-1}
function staffLoaded(){
  S.staff=Object.keys(S.staffChunks).sort().flatMap(k=>S.staffChunks[k]);
  S.staffIdx={};S.staffById={};S.staff.forEach(r=>{S.staffIdx[skey(r.n)]=r;if(r.sn)S.staffById[String(r.sn)]=r});
  const dl=document.getElementById("staffnames");
  dl.innerHTML=S.staff.map(r=>`<option value="${esc(r.n)}">${esc(r.g)} · ${esc(r.pos)} · ${esc(r.plc||r.dept)}</option>`).join("");
}
function roleOf(name){const k=norm(name);const inc=posList().filter(p=>norm(p.incumbent)===k).length;const noms=poolList().reduce((a,p)=>a+(p.successors||[]).filter(s=>norm(s.n)===k).length,0);return {inc,noms}}
function gradeBand(g){const m=String(g).match(/^[A-Z]+\d+/);return m?m[0]:g}
function staffRows(){
  const q=S.sf.q.toLowerCase();
  return S.staff.filter(r=>(!S.sf.dept||r.dept===S.sf.dept)&&(!S.sf.g||gradeBand(r.g)===S.sf.g)&&(!q||(r.n+" "+r.pos+" "+r.job+" "+r.sn+" "+r.plc).toLowerCase().includes(q)));
}
const GORDER=["J00","M16","CM16","M15","CM15","E17","E16","E15","E14","E13","E12","E08A","E08"];
function staffBody(){
  const rows=staffRows();

  rows.sort((a,b)=>gi(a.g)-gi(b.g)||a.n.localeCompare(b.n));
  const shown=rows.slice(0,S.sf.lim);
  return `<div class="faint" style="font-size:12.5px;margin:0 0 8px">${rows.length} of ${S.staff.length} executives${rows.length>shown.length?` · showing first ${shown.length}`:""}</div>

  ${shown.map(r=>{const ro=roleOf(r.n);return `<tr><td><button class="linkish" data-person="${esc(r.n)}">${esc(r.n)}</button><div class="faint mono" style="font-size:11px">${esc(r.sn)}</div></td><td class="mono">${esc(r.g)}</td><td>${esc(r.pos)}${r.job&&r.job!==r.pos?`<div class="faint" style="font-size:12px">${esc(r.job)}</div>`:""}</td><td>${esc(r.dept)}<div class="faint" style="font-size:12px">${esc(r.plc)}</div></td><td class="num">${staffAge(r)??""}</td><td class="num" style="white-space:nowrap">${retSoon(r.ret)?`<span class="status warn">${fmtD(r.ret)}</span>`:fmtD(r.ret)}</td>${secretView()?"":`<td><div class="chips" style="justify-content:flex-start">${ro.inc?`<span class="chip" style="background:var(--accent-soft);color:var(--accent)">Incumbent</span>`:""}${ro.noms?`<span class="chip c0">Successor ×${ro.noms}</span>`:""}</div></td>`}${canEditStaff()?`<td class="act"><button class="btn ghost" data-sfedit="${esc(r.sn)}">Edit</button></td>`:""}</tr>`}).join("")||`<tr><td colspan="7" class="faint">No executives match these filters.</td></tr>`}
  </tbody></table></div>${rows.length>shown.length?`<div style="text-align:center;margin-top:10px"><button class="btn" data-more>Show 150 more</button></div>`:""}`;
}
function canEditStaff(){return isFull()||S.auth.role==="admin"}
function staffChunkOf(sn){for(const [k,rows] of Object.entries(S.staffChunks))if(rows.some(r=>String(r.sn)===String(sn)))return k;return null}
const SF_FIELDS=[["n","Name"],["sn","Staff no."],["g","Grade (Payscale Group)"],["cat","Category"],["pos","Position"],["job","Job / unit"],["dept","Department"],["ou","Org unit"],["plc","Placement"],["em","Email"],["joined","Date joined TNB","date"],["since","In position since","date"],["ret","Retirement date","date"],["qual","Qualification"],["study","Branch of study"]];

  <div class="edit-actions">${sn?`<button type="button" class="btn danger" data-sfdel>Remove from directory</button>`:""}<span style="flex:1"></span><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">${sn?"Save changes":"Add staff"}</button></div></form>`;
  const d=$("#dlg");if(!d.open)d.showModal();
}
async function saveStaffEdit(del){
  const old=S.sfEdit;const o={};document.querySelectorAll("[data-sfe]").forEach(i=>o[i.dataset.sfe]=i.value.trim());
  if(!del){if(!o.n||!o.sn){toast("Name and staff no. are required.");return}if(o.em)o.em=o.em.toLowerCase();if(String(o.sn)!==String(old)&&S.staffById[o.sn]){toast("That staff no. is already in the directory.");return}}
  const prev=old?S.staffById[String(old)]:null;
  const rec={...(prev||{}),...o};delete rec.age;
  try{
    let k=old?staffChunkOf(old):null;
    if(k){let rows=[...S.staffChunks[k]];const ix=rows.findIndex(r=>String(r.sn)===String(old));if(del)rows.splice(ix,1);else rows[ix]=rec;await S.db.doc("staff/"+k).set({rows})}
    else{const keys=Object.keys(S.staffChunks).sort();let last=keys[keys.length-1]||"chunk-0";let rows=[...(S.staffChunks[last]||[])];
      if(rows.length>=400){last="chunk-"+keys.length;rows=[]}rows.push(rec);await S.db.doc("staff/"+last).set({rows})}
    $("#dlg").close();toast(del?"Removed from the staff directory":old?"Staff record saved":"Staff added");
  }catch(e){console.error(e);toast(e?.code==="invalid_argument"?"You don't have permission to change the staff directory.":"Couldn't save the staff record.")}
}

const SYNC_ST=["Planned","Done","Postponed","Cancelled","Position vacant"];
function syncYears(){const ys=new Set(Object.values(S.syncs).map(r=>+r.year).filter(Boolean));ys.add(NOW.getFullYear());if(S.syncYear)ys.add(+S.syncYear);return [...ys].sort((a,b)=>b-a)}
function tm(t){if(!t)return"";const [h,m]=t.split(":").map(Number);return `${((h+11)%12)+1}.${String(m).padStart(2,"0")} ${h<12?"am":"pm"}`}
function dur(a,b){if(!a||!b)return"";const [h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number);const d=(h2*60+m2)-(h1*60+m1);if(d<=0)return"";return d>=60?`${Math.floor(d/60)} h${d%60?" "+d%60+" min":""}`:`${d} min`}
function syncStatusChip(r){const c={Done:"background:var(--r0-soft);color:var(--r0)",Planned:"background:var(--accent-soft);color:var(--accent)",Postponed:"background:var(--r1-soft);color:var(--r1)",Cancelled:"background:var(--crit-soft);color:var(--crit)","Position vacant":"background:var(--sunk);color:var(--ink-2)"}[r.status]||"";
  const overdue=r.status==="Planned"&&r.pDate&&parseDate(r.pDate)<new Date(NOW.toDateString());
  return `<span class="flag" style="${c}">${esc(r.status||"Planned")}</span>${overdue?` <span class="flag warn">Date passed</span>`:""}`}

  <div class="edit-actions">${id!=="new"?(S.confirmDel===id?`<span class="faint" style="font-size:13px;align-self:center">Delete this session?</span><button class="btn danger" data-syncdel="${id}">Yes, delete</button><button class="btn" data-syncdelno>Keep</button>`:`<button class="btn ghost danger" data-syncdelask="${id}">Delete</button>`):""}<span style="flex:1"></span><button class="btn" data-cancel>Cancel</button><button class="btn primary" data-syncsave="${id}">Save session</button></div>
  </div></td></tr>`;

function readBench(root){
  return [...root.querySelectorAll(".erow")].map(r=>{const o={};r.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=i.value.trim());return {n:o.n||"",r:o.r||"R2",g:o.g||"",note:o.note||""}}).filter(s=>s.n);
}
function readInc(root){const o={};root.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=i.value.trim());o.age=o.age?Number(o.age):null;return o}
function diffBench(a,b){
  const A=new Map(a.map(s=>[norm(s.n),s])),B=new Map(b.map(s=>[norm(s.n),s]));const out=[];
  B.forEach((s,k)=>{if(!A.has(k))out.push(`+ ${s.n} (${s.r})`);else if(A.get(k).r!==s.r)out.push(`${s.n}: ${A.get(k).r} → ${s.r}`)});
  A.forEach((s,k)=>{if(!B.has(k))out.push(`− ${s.n}`)});return out;
}
function dupCheck(list){const seen=new Set();for(const s of list){const k=norm(s.n);if(seen.has(k))return s.n;seen.add(k)}return null}
async function logIt(text,detail,track){if(secretView())return;try{await S.db.collection("log").add({at:new Date().toISOString(),by:S.auth.email||"",text,detail:detail||"",track:track||""})}catch(e){}}
function stamp(){return {updatedAt:new Date().toISOString(),updatedBy:S.uid||""}}
async function savePool(poolId,root,label){
  const list=readBench(root);const d=dupCheck(list);if(d){toast(`${d} is listed twice. Remove one entry before saving.`);return false}
  const before=S.pools[poolId]?.successors||[];const ch=diffBench(before,list);
  const changedGrades=list.some(s=>{const o=before.find(b=>norm(b.n)===norm(s.n));return o&&(o.g!==s.g||o.note!==s.note)});
  if(!ch.length&&!changedGrades)return null;
  await S.db.doc("pools/"+poolId).update({successors:list,...stamp()});
  await logIt(`updated successors for ${label}`,ch.join(" · ")||"Grade or note changes",S.pools[poolId]?.track);
  return true;
}
async function savePos(pid,root){
  const p=S.positions[pid];const v=readInc(root);const ch=[];
  if(!v.role){toast("Enter a position name before saving.");throw{code:"skip"}}
  const lab={role:"Position",full:"Full title",cat:"Category",pgrade:"Position grade",status:"Status",stNote:"Status note",incumbent:"Incumbent",grade:"Incumbent grade",age:"Age",jik:"JIK",retire:"Retirement"};
  Object.keys(v).forEach(k=>{if(lab[k]&&String(p[k]??"")!==String(v[k]??""))ch.push(`${lab[k]}: ${p[k]||"—"} → ${v[k]||"—"}`)});
  if(!ch.length)return null;
  if(!v.incumbent&&v.status==="In post")v.status="Vacant";
  if(v.cat&&v.cat!==p.cat){const m=catsOf(p.track);if(m[v.cat])v.pool=m[v.cat]}
  await S.db.doc("positions/"+pid).update({...v,...stamp()});
  if(p.track==="L2"&&v.role!==p.role&&S.pools[p.pool])await S.db.doc("pools/"+p.pool).update({label:v.role});
  await logIt(`updated ${v.role}`,ch.join(" · "),p.track);
  return true;
}
async function addPosition(tr){
  const ps=posList(tr);const order=Math.max(0,...ps.map(p=>p.order||0))+1;
  const id=tr.toLowerCase()+"-x"+Date.now().toString(36);
  let pool,cat;
  if(tr==="L2"){pool=id;cat="L2 Leadership";await S.db.doc("pools/"+pool).set({track:"L2",label:"New position",successors:[],...stamp()})}
  else{const m=catsOf(tr);cat=Object.keys(m)[0];pool=m[cat]}
  await S.db.doc("positions/"+id).set({track:tr,cat,role:"New position",full:"",pgrade:"",status:"Vacant",stNote:"",incumbent:"",grade:"",age:null,jik:"",retire:"",pool,order,...stamp()});
  await logIt(`added a position to ${TRACKS[tr].name}`,"",tr);
  return id;
}
async function deletePosition(pid){
  const p=S.positions[pid];
  await S.db.doc("positions/"+pid).delete();
  if(p.track==="L2"&&!posList("L2").some(x=>x.id!==pid&&x.pool===p.pool))await S.db.doc("pools/"+p.pool).delete();
  await logIt(`deleted position ${p.role}`,p.incumbent?`Incumbent was ${p.incumbent}`:"",p.track);
  return true;
}
async function guarded(fn){
  try{const r=await fn();S.editing=null;render();toast(r===null?"No changes to save":"Saved");}
  catch(e){if(e?.code==="skip"){document.querySelectorAll("[data-syncsave]").forEach(b=>b.disabled=false);return}console.error(e);if(e?.code==="invalid_argument"){S.canWrite=false;S.editing=null;render();toast("You don't have edit access to this portal.")}else toast("Couldn't save. Check your connection and try again.")}
}

function initials(n){return String(n||"?").replace(/\b(bin|binti|bt|b|a\/l|a\/p)\b/gi,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function avatar(c,size){return c.photoDataUrl?`<img class="tc-av" style="width:${size}px;height:${size}px" alt="" src="${esc(c.photoDataUrl)}">`:`<span class="tc-av tc-av-i" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px">${esc(initials(c.name))}</span>`}
/* live links to the succession plan (no duplicated data) */
function tcHeld(c){const k=skey(c.name);return posList().filter(p=>p.incumbent&&skey(p.incumbent)===k)}
/* Successor status = this person's OWN nominations as a successor for other positions (not the bench of the position they hold). */
function tcLiveSS(c){const noms=tcLiveNoms(c);if(!noms.length)return null;const cn={R0:0,R1:0,R2:0};const pos={R0:[],R1:[],R2:[]};noms.forEach(n=>{if(cn[n.readiness]!=null){cn[n.readiness]++;pos[n.readiness].push(n.position)}});return {n:noms.length,c:cn,pos}}
function tcLiveNoms(c){if(secretView())return [];const k=skey(c.name);const out=[];poolList().forEach(pl=>(pl.successors||[]).forEach(s=>{if(skey(s.n)===k)out.push({position:(pl.track==="L2"?"":TRACKS[pl.track].short+" · ")+pl.label,readiness:s.r,status:"Named in 2026 succession plan",approvalDate:"",live:true})}));return out.sort((a,b)=>rank[a.readiness]-rank[b.readiness])}
function tcSS(c){const live=tcLiveSS(c);const st=c.successorStatus||[];return ["R0","R1","R2"].map(l=>{const row=st.find(x=>x.label===l)||{};return {label:l,total:live?live.c[l]:(row.total??""),status:live?(live.pos[l].join("; ")||row.status||""):(row.status||"")}})}
function tcNoms(c){return [...tcLiveNoms(c),...(c.nominations||[])]}

/* ---------- views ---------- */
function vTC(){
  if(!S.db)return `<div class="empty">Talent cards need the portal's shared storage. ${syncNotice(true)}</div>`;
  if(!S.tc.loaded||!S.tc.adminsLoaded)return `<div class="empty">Loading talent cards…</div>`;
  const admin=tcIsAdmin();const mine=tcMine();
  if(!admin&&!mine&&!isViewer())return `<div class="empty">This account can't open talent cards. Sign out and sign in again.</div>`;
  if(isViewer()&&S.tc.mode==="edit")S.tc.mode="view";
  if(!admin&&!isViewer()){S.tc.view="card";S.tc.id=mine;if(S.tc.mode==="edit")S.tc.mode="view"}
  if(S.tc.view==="card"&&(S.tc.cards[S.tc.id]||S.tc.isNew))return tcCardView(admin);
  S.tc.view="list";return tcList();
}
function tcList(){
  const all=Object.entries(S.tc.cards).map(([id,c])=>({id,...c}));
  const q=S.tc.q.toLowerCase();
  const rows=all.filter(c=>!q||[c.name,c.staffId,c.post,c.department].join(" ").toLowerCase().includes(q)).sort((a,b)=>(rank2(a.riskOfLoss)-rank2(b.riskOfLoss))||a.name.localeCompare(b.name));
  const n=r=>all.filter(c=>c.riskOfLoss===r).length;
  const adm=Object.values(S.tc.admins).filter(a=>a.email!==OWNER_EMAIL).sort((a,b)=>a.email.localeCompare(b.email));
  return `<section><div class="section-head"><div><div class="eyebrow">Employee e-portfolio · masterlist</div><h2>Talent Card</h2></div>
    <div class="toolbar">${isViewer()?"":`<button class="btn" data-tcadmins>${S.tc.showAdmins?"Close":isOwnerSession()?"Manage access":"My password"}</button><button class="btn primary" data-tcnew>+ New talent card</button>`}${S.auth.role?`<button class="btn ghost" data-tcsignout>Sign out</button>`:""}</div></div>
  ${S.tc.showAdmins?`<div class="panel" style="margin-bottom:14px">${isOwnerSession()?`<div class="section-head"><div><h3 style="font-size:15px">People with access</h3><div class="faint" style="font-size:12.5px"><strong>Full access</strong>: sees and edits the whole portal (cannot manage access). <strong>View only</strong>: sees the whole portal, read-only. <strong>Admin</strong>: talent cards and staff directory only.</div></div></div>
    <ul class="ppl">${adm.length?adm.map(a=>`<li><span><span class="mono">${esc(a.email.endsWith("@"+USERNAME_DOMAIN)?a.email.split("@")[0]:a.email)}</span> <span class="pill">${esc({viewer:"View only",editor:"Full access"}[a.role]||"Admin")}</span>${a.name?` <span class="faint" style="font-size:12px">${esc(a.name)}</span>`:""}</span><button class="btn ghost danger" data-tcadmrm="${esc(a.email)}">Remove access</button></li>`).join(""):`<li class="faint">No one else has access yet.</li>`}</ul>
    <div class="toolbar" style="margin-top:10px"><div class="field" style="flex:1 1 160px"><label for="tc-admin-role">Access</label><select id="tc-admin-role"><option value="editor">Full access (view &amp; edit)</option><option value="viewer">View only</option><option value="admin" selected>Admin (talent card &amp; staff)</option></select></div><div class="field" style="flex:1 1 200px"><label for="tc-admin-new">Username</label><input id="tc-admin-new" placeholder="e.g. hod1" autocomplete="off"></div><div class="field" style="flex:1 1 180px"><label for="tc-admin-pw">Password</label><input id="tc-admin-pw" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div><button class="btn primary" data-tcadmadd style="align-self:end">Add user</button></div>`:""}
    ${hasPw()?`<div class="toolbar" style="margin-top:10px"><div class="field" style="flex:1 1 220px"><label for="my-pw">Change my password</label><input id="my-pw" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div><button class="btn" data-mypw style="align-self:end">Change my password</button></div>`:""}</div>`:""}
  <div class="kv num tc-stats"><div><div class="v">${all.length}</div><div class="l">Total employees</div></div><div><div class="v" style="color:var(--crit)">${n("High")}</div><div class="l">Risk of leaving: High</div></div><div><div class="v" style="color:var(--r1)">${n("Medium")}</div><div class="l">Medium</div></div><div><div class="v" style="color:var(--r0)">${n("Low")}</div><div class="l">Low</div></div><div><div class="v" style="color:var(--ink-3)">${all.length-n("High")-n("Medium")-n("Low")}</div><div class="l">Not rated</div></div></div>
  <div class="toolbar" style="margin:12px 0"><div class="field" style="flex:1 1 300px"><label for="tc-q">Search</label><input id="tc-q" type="search" data-tcq value="${esc(S.tc.q)}" placeholder="Name, staff ID, position or department"></div><span class="faint" style="font-size:12.5px;align-self:end">${rows.length} of ${all.length}</span></div>
  <div class="tbl-wrap" id="tc-tbl">${tcRows(rows)}</div></section>`;
}
function rank2(r){return {High:0,Medium:1,Low:2}[r]??3}
function tcRows(rows){return `<table class="tc-table"><thead><tr><th>Employee</th><th>Position</th><th>Department</th><th>Grade</th><th>Risk of leaving</th><th>Updated</th></tr></thead><tbody>${rows.map(c=>`<tr class="tc-row" data-tcopen="${esc(c.id)}" tabindex="0"><td><div class="tc-who">${avatar(c,34)}<div><strong>${esc(c.name)}</strong><div class="faint mono" style="font-size:11.5px">${esc(c.staffId||"—")}</div></div></div></td><td>${esc(c.post)}</td><td>${esc(c.department)}</td><td class="mono">${esc(c.grade)}</td><td>${riskBadge(c.riskOfLoss)}</td><td class="faint" style="white-space:nowrap;font-size:12.5px">${c.updatedAt?fmtD(c.updatedAt.slice(0,10)):"—"}</td></tr>`).join("")||`<tr><td colspan="6" class="faint" style="text-align:center;padding:24px">No employees match this search.</td></tr>`}</tbody></table>`}

function tcCardView(admin){
  const id=S.tc.id;const edit=S.tc.mode==="edit";const c=edit?S.tc.draft:S.tc.cards[id];
  const retL=S.tc.ret?(TABS.find(x=>x[0]===S.tc.ret.tab)?.[1]||"previous page"):"";
  const bar=`<div class="tc-bar">${retL?`<button class="btn primary" data-tcret>← Back to ${esc(retL)}</button>`:""}${admin||isViewer()?`<button class="btn" data-tcback>← Masterlist</button>`:`<span class="eyebrow">My Talent Card</span>`}<span style="flex:1"></span>
    ${edit?`<button class="btn" data-tccancel>Cancel</button><button class="btn primary" data-tcsave>${S.tc.isNew?"Create card":"Save changes"}</button>`:
    `<button class="btn" data-tcslide>Slide View</button><button class="btn" data-tcppt>Download PPT</button>${admin?`<button class="btn primary" data-tcedit>Edit</button>`:""}${S.auth.role?`<button class="btn ghost" data-tcsignout>Sign out</button>`:""}`}</div>`;
  return `<section class="tc-card">${bar}${edit?tcEditBody(c):tcViewBody(c)}

}
const P=(title,body,cls="")=>`<div class="tc-p ${cls}"><div class="tc-ph">${title}</div><div class="tc-pb">${body}</div></div>`;
const ul=a=>(a||[]).filter(Boolean).length?`<ul class="tc-ul">${a.filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<span class="faint">—</span>`;
function kvRow(l,v){return `<div class="tc-kv"><span>${l}</span><span>${v||"—"}</span></div>`}
function tcViewBody(c){
  const ss=tcSS(c),live=tcLiveSS(c),noms=tcNoms(c);

  ${P("Employee information",`<div class="tc-info">${avatar(c,96)}<div style="min-width:0"><h2 style="font-size:19px">${esc(c.name)}</h2><div class="muted">${esc(c.post)}</div><div class="faint" style="font-size:13px">${esc(c.department)}</div></div></div>

  ${P("Education",(c.education||[]).length?`<ul class="tc-ul">${c.education.map(e=>`<li><strong>${esc(e.level)}</strong>${e.detail?` · ${esc(e.detail)}`:""}${e.year?` <span class="faint">(${esc(e.year)})</span>`:""}</li>`).join("")}</ul>`:`<span class="faint">—</span>`)}

/* ---------- edit ---------- */
function inp(k,v,type="text",extra=""){return `<input id="tce-${k}" data-tck="${k}" type="${type}" value="${esc(v??"")}" ${extra}>`}
function fld(k,lab,v,type,extra){return `<div class="field"><label for="tce-${k}">${lab}</label>${inp(k,v,type,extra)}</div>`}
function lEd(key,title,cls=""){
  const subs=TC_LISTS[key];const rows=S.tc.draft[key]||[];
  const r=(row,i)=>subs?`<div class="tc-er" style="grid-template-columns:repeat(${subs.length},minmax(0,1fr)) 28px">${subs.map(s=>s==="readiness"?`<select aria-label="${TC_LABELS[s]}" data-tcl="${key}" data-i="${i}" data-s="${s}"><option value=""></option>${["R0","R1","R2"].map(x=>`<option ${row[s]===x?"selected":""}>${x}</option>`).join("")}</select>`:`<input aria-label="${TC_LABELS[s]}" placeholder="${TC_LABELS[s]}" data-tcl="${key}" data-i="${i}" data-s="${s}" type="${s==="approvalDate"?"date":"text"}" value="${esc(row[s]??"")}">`).join("")}<button class="x" data-tcrm="${key}" data-i="${i}" aria-label="Remove row">×</button></div>`
    :`<div class="tc-er" style="grid-template-columns:1fr 28px"><input aria-label="${esc(title)}" data-tcl="${key}" data-i="${i}" value="${esc(row)}"><button class="x" data-tcrm="${key}" data-i="${i}" aria-label="Remove row">×</button></div>`;
  return P(title,`<div class="tc-el">${rows.map(r).join("")}</div><button class="btn ghost" data-tcadd="${key}">+ Add row</button>`,cls);
}

      <div class="field" style="grid-column:span 2"><label for="tce-name">Name</label>${inp("name",d.name,"text",'list="staffnames" autocomplete="off"')}</div>

      ${fld("department","Department",d.department)}${fld("grade","Grade",d.grade)}${d.retirementDate&&ageFromRet(d.retirementDate)!=null?fld("age","Age (auto from retirement date)",ageFromRet(d.retirementDate),"number",'readonly'):fld("age","Age",d.age,"number",'min="18" max="70"')}
      ${fld("dateJoined","Date joined",d.dateJoined,"date")}${fld("retirementDate","Retirement date",d.retirementDate,"date")}${fld("contractEndDate","Contract end date",d.contractEndDate,"date")}${fld("flag","Flag",d.flag,"text",'placeholder="e.g. High performer, Successor"')}${fld("assessmentSource","Assessment source",d.assessmentSource,"text",'placeholder="e.g. Accendo 2023"')}
    </div><div class="faint" style="font-size:12px">Picking a name from the staff list fills staff ID, position, department, grade, age, dates and email.</div>`,"span2")}

  ${lEd("careerAspiration","Career aspiration")}
  ${P("Risk of leaving current position",`<div class="fields">
      <div class="field"><label for="tce-riskOfLoss">Risk of loss</label><select id="tce-riskOfLoss" data-tck="riskOfLoss"><option value="">Not rated</option>${RISKS.map(r=>`<option ${d.riskOfLoss===r?"selected":""}>${r}</option>`).join("")}</select></div>
      <div class="field"><label for="tce-impactOfLoss">Impact of loss</label><select id="tce-impactOfLoss" data-tck="impactOfLoss"><option value="">Not rated</option>${RISKS.map(r=>`<option ${d.impactOfLoss===r?"selected":""}>${r}</option>`).join("")}</select></div>
      <div class="field" style="grid-column:1/-1"><label for="tce-reasonForLeaving">Reason for leaving</label>${inp("reasonForLeaving",d.reasonForLeaving)}</div></div>
    <div class="eyebrow" style="margin:10px 0 4px">Successor status${live?` · totals live from own nominations`:""}</div>
    ${["R0","R1","R2"].map((l,i)=>{const row=(d.successorStatus||[]).find(x=>x.label===l)||{};return `<div class="tc-er" style="grid-template-columns:44px 80px 1fr"><span class="chip c${i}" style="align-self:center;text-align:center">${l}</span><input aria-label="${l} total" data-tcss="${l}" data-s="total" value="${esc(live?live.c[l]:(row.total??""))}" ${live?"disabled":""} placeholder="Total"><input aria-label="${l} status" data-tcss="${l}" data-s="status" value="${esc(row.status||"")}" placeholder="Status"></div>`}).join("")}`,"span2")}

function tcFillFromStaff(name){
  const r=S.staffIdx[skey(name)];if(!r)return false;const d=S.tc.draft;
  Object.assign(d,{name:r.n,staffId:r.sn,post:r.pos+(r.job&&r.job!==r.pos?", "+r.job:""),department:r.dept,grade:r.g,age:staffAge(r),retirementDate:r.ret||"",dateJoined:r.joined||d.dateJoined,email:r.em||d.email});
  if(!(d.education||[]).length&&r.qual)d.education=[{level:r.qual,detail:r.study||"",year:""}];
  const pr=S.people[norm(r.n)]||S.people[norm(name)];
  if(!(d.workExperience||[]).length&&pr?.exp?.length)d.workExperience=pr.exp.map(x=>{const m=x.split(/\s+[–-]\s+/);return {company:"",post:m[0],dept:m.slice(1).join(" – ")}});
  return true;
}
function tcClean(d){
  const o=JSON.parse(JSON.stringify(d));
  ["careerAspiration","keyAchievements","strength","development"].forEach(k=>o[k]=(o[k]||[]).map(x=>String(x).trim()).filter(Boolean));
  ["education","workExperience","kpi","nominations"].forEach(k=>o[k]=(o[k]||[]).filter(r=>Object.values(r).some(v=>String(v??"").trim())));
  o.email=(o.email||"").trim().toLowerCase();o.age=o.age===""||o.age==null?null:Number(o.age);
  delete o.updatedAt;delete o.updatedBy;return o;
}
async function tcSave(){
  const d=tcClean(S.tc.draft);
  if(!d.name){toast("Enter the employee's name before saving.");return}
  if(d.email){const dup=Object.entries(S.tc.cards).find(([id,c])=>id!==S.tc.id&&(c.email||"").toLowerCase()===d.email);if(dup){toast(`${d.email} is already used on ${dup[1].name}'s card.`);return}}
  S.tc.busy=true;
  try{
    let id=S.tc.id;
    if(S.tc.isNew){id=(d.staffId||"").replace(/[^A-Za-z0-9_-]/g,"")||("tc-"+Date.now().toString(36));if(S.tc.cards[id])id=id+"-"+Date.now().toString(36)}
    await S.db.doc("talentCards/"+id).set({...d,updatedAt:new Date().toISOString(),updatedBy:S.uid||""});
    await logIt(`${S.tc.isNew?"created":"updated"} the talent card for ${d.name}`,"","TC");
    S.tc.id=id;S.tc.isNew=false;S.tc.mode="view";S.tc.draft=null;S.editing=null;render();toast("Saved");
  }catch(e){console.error(e);toast(e?.code==="invalid_argument"?"You don't have edit access to talent cards.":e?.code==="quota_exceeded"?"Storage is full. Remove a photo or old cards and try again.":"Couldn't save. Check your connection and try again.")}
  finally{S.tc.busy=false}
}

"Pos. grade","Incumbent","Grade","Age","R0","R1","R2","Total"].map((h,i)=>({text:h,options:{bold:true,color:"FFFFFF",fill:{color:i>=6&&i<=8?RC["R"+(i-6)]:NAVY},align:i>=4?"center":"left"}}));
        const body=rows.slice(k,k+per).map((r,ri)=>r.map((v,i)=>({text:v,options:{color:INK,fill:{color:ri%2?"FFFFFF":TINT},align:i>=4?"center":"left",bold:i===0}})));
        const colW=tr==="L2"?[3.4,0,1,4.2,0.9,0.7,0.6,0.6,0.6,0.7]:[2.2,2.6,0.9,3.4,0.8,0.6,0.5,0.5,0.5,0.6];
        const keep=colW.map((w,i)=>w>0);
        s.addTable([head.filter((_,i)=>keep[i]),...body.map(r=>r.filter((_,i)=>keep[i]))],{x:0.35,y:1.05,w:12.6,colW:colW.filter(w=>w>0),fontSize:10,fontFace:F,margin:[2,4,2,4],border:{type:"solid",color:LINE,pt:0.5},rowH:0.3});
      }
      // one slide per position / category
      groups.forEach(g=>{
        const s=pptx.addSlide();header(s,g.title,TRACKS[tr].short+(g.full&&g.full!==g.title?" · "+g.full:""));
        const incTxt=g.positions.map(p=>[{text:(tr==="L2"?"Incumbent: ":p.role+": "),options:{color:GREY}},{text:isVacant(p)?"VACANT":(p.incumbent||"—"),options:{bold:true,color:isVacant(p)?"C62828":INK}},{text:isVacant(p)?"":`  ${p.grade||""}${posAge(p)?" · age "+posAge(p):""}${incRet(p)?" · retires "+fmtD(incRet(p)):""}`,options:{color:GREY,breakLine:true}}]).flat();
        const incH=Math.min(1.6,0.3*g.positions.length+0.1);
        s.addText(incTxt,{x:0.35,y:1.0,w:12.6,h:incH,fontSize:g.positions.length>4?9.5:11,fontFace:F,valign:"top",margin:[2,6,2,6],fill:{color:TINT}});
        const ss=groupSucc(g);const top=1.0+incH+0.15,colw=4.1,gap=0.15,avail=7.0-top;
        ["R0","R1","R2"].forEach((r,i)=>{const x=0.35+i*(colw+gap);const list=ss.filter(z=>z.r===r);
          s.addText(`${r} · ${RL[r]} (${list.length})`,{x,y:top,w:colw,h:0.34,fontSize:12,bold:true,color:"FFFFFF",fill:{color:RC[r]},fontFace:F,margin:[0,6,0,6],valign:"middle"});
          if(!list.length){s.addText("None named",{x,y:top+0.4,w:colw,h:0.3,fontSize:10,italic:true,color:GREY,fontFace:F,margin:[0,6,0,6]});return}
          const fs=list.length>12?7.5:list.length>8?8.5:10;const rh=Math.min(0.55,(avail-0.45)/list.length);
          const body=list.map(z=>[{text:[{text:z.name,options:{bold:true,color:INK,breakLine:!!z.post}},...(z.post?[{text:z.post,options:{color:GREY,fontSize:fs-1.5}}]:[])]},{text:z.g,options:{color:INK,align:"center"}}]);
          s.addTable(body,{x,y:top+0.4,w:colw,colW:[colw-0.75,0.75],fontSize:fs,fontFace:F,margin:[1,4,1,4],border:{type:"solid",color:LINE,pt:0.5},rowH:rh,valign:"middle"});
        });
      });
    });
    const blob=await pptx.write({outputType:"blob"});
    await saveFile(expName(trs,"pptx"),blob);
  }catch(e){console.error(e);toast("Couldn't build the PowerPoint file: "+(e?.message||e))}
}
